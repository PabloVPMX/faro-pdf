name: Build and verify Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build and verify source, executable, installer and portable archive
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FaroPDF-Windows-verified
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FaroPDF-build-diagnostics
          path: |
            .cache/validation/*.json
            .cache/validation/*.png
            .cache/build/FaroPDF/warn-FaroPDF.txt
          if-no-files-found: ignore
          retention-days: 14
