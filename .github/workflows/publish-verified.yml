name: Publish verified Windows release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        required: true
        type: string
      expected_sha:
        description: Exact source commit verified by that run
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: faro-release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERIFIED_RUN_ID: ${{ inputs.run_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Test source identity, permissions and repeat publication
        run: python -m unittest discover -s tests -p test_publish_verified.py -v
      - name: Check build identity and conclusion
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          assert os.environ['VERIFIED_RUN_ID'].isdecimal()
          assert re.fullmatch('[a-f0-9]{40}',os.environ['EXPECTED_SHA'])
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" > verified-run.json
          python - <<'PY'
          import os,json
          run=json.load(open('verified-run.json'))
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['EXPECTED_SHA']
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert run['name']=='Build and verify Windows'
          assert run['path']=='.github/workflows/build-windows.yml'
          assert run['event'] in ('push','workflow_dispatch')
          PY
      - name: Download only the verified release artifact
        run: gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FaroPDF-Windows-verified --dir release
      - name: Verify artifacts and publish or verify the existing release
        id: publication
        run: python packaging/publish_verified.py
      - name: Check public installer availability
        run: curl --fail --head --location --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.publication.outputs.tag }}/FaroPDF-${{ steps.publication.outputs.version }}-Instalar.exe"
